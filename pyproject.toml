[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onlydns-sdk"
version = "1.0.0"
description = "Official Python SDK for the OnlyDNS System API (onlydns.com)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "OnlyDNS", email = "support@onlydns.com" }
]
keywords = ["onlydns", "dns", "sdk", "ai-agents", "networking"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Name Service (DNS)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
onlydns = "onlydns.cli:main"

[project.urls]
Homepage = "https://onlydns.com"
Documentation = "https://api-docs.onlydns.com/"
Repository = "https://github.com/onlydns/onlydns-sdk-python"
